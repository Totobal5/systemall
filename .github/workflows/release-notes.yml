name: Release Notes

on:
    push:
        tags:
            - "[0-9]*.[0-9]*"
            - "v[0-9]*.[0-9]*"
            - "[0-9]*.[0-9]*.[0-9]*"
            - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
    contents: write
    issues: read
    pull-requests: read

jobs:
    notes-header:
        runs-on: ubuntu-latest
        steps:
            - name: Release notes header
                uses: tinkerer-red/GML-Actions/actions/release-notes/header@v2

    notes-issues:
        needs: notes-header
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0
            - name: Append issues closed
                uses: tinkerer-red/GML-Actions/actions/release-notes/issues@v2

    notes-commits:
        needs: notes-issues
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0
            - name: Append commits
                uses: tinkerer-red/GML-Actions/actions/release-notes/commits@v2
