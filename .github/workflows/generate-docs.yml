name: Generate Docs

on:
release:
    types: [published]

issues: write

jobs:
generate-docs:
    runs-on: windows-latest
    steps:
    - name: Checkout
        uses: actions/checkout@v4
        with:
            fetch-depth: 0


permissions:
    contents: write
    issues: write
            project-file: "systemall.yyp"
            release-tag: ${{ github.event.inputs.release_tag }}
    generate-docs:
        runs-on: windows-latest
        steps:
            - name: Checkout
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            - name: Generate and publish docs
                uses: tinkerer-red/GML-Actions/actions/generate-docs@v2
                with:
                    project-file: "systemall.yyp"
                    release-tag: ${{ github.event.inputs.release_tag }}
                    output-path: "C:/tome-output"
                    create-issue-on-failure: "false"
                    verbose: "false"
